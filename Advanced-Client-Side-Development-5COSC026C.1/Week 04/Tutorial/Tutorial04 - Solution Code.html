<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>CSS Gradients, Animation & Transformation</title>
<style>
    /* --- 1. General Styles --- */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        /* Necessary to position the absolute ribbon relative to the body */
        position: relative; 
        overflow-x: hidden; /* Prevents scrollbar if ribbon sticks out */
    }

    /* --- 2. Header Styling (Task: Change font, bold, 24px, center, 40px padding) --- */
    header {
        font-weight: bold;
        font-size: 24px;
        text-align: center;
        padding: 40px;
        background-color: #f0f0f0; /* Added light grey to see padding clearly */
    }

    /* --- 3. Article Header Override (Task: Align left, 18px, 20px padding) --- */
    /* We use 'article header' to be more specific than just 'header' */
    article header {
        text-align: left;
        font-size: 18px;
        padding: 20px;
        background-color: transparent; /* Removing background for inner header */
        border-bottom: 2px solid #ccc; /* Adding a line to make it look distinct */
    }

    /* --- 4. The Ribbon Container (Task: Rotate -45deg, position, gradient, shadow) --- */
    .ribbon {
        /* Positioning: Absolute places it relative to the nearest positioned ancestor (body) */
        position: absolute;
        top: 20px;
        left: -30px; /* Pulling it left to cut across the corner */
        
        /* Transformation: Rotates the element counter-clockwise */
        transform: rotate(-45deg);
        
        /* Background Gradient: Linear gradient from red to orange */
        background: linear-gradient(45deg, #ff0000, #ff7f50);
        
        /* Box Shadow: Adds a 3D effect (horizontal, vertical, blur, color) */
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        
        width: 200px;
        text-align: center;
        z-index: 10; /* Ensures it sits on top of other content */
    }

    /* --- 5. The Ribbon Link (Task: Color, border, padding, no underline, pretty) --- */
    .ribbon a {
        color: white; /* Custom text colour */
        border: 1px solid white; /* Solid border */
        padding: 5px 20px; /* Padding */
        text-decoration: none; /* Remove underline decoration */
        
        /* Making it pretty */
        display: block; /* Makes the link fill the div */
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* --- 6. Creating the Animation (Task: Use @keyframes) --- */
    @keyframes spinner {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    /* --- 7. Applying Animation to ONE image (Task: Without Class or ID) --- */
    /* DIFFICULTY NOTE: 
       Applying 'img { animation: ... }' would make ALL images spin.
       To target just one without a class/ID, we use the structure.
       Here, we target only the image inside the <article> tag.
    */
    article img {
        animation: spinner 3s linear infinite;
        
        /* Optional: Makes it look circular while spinning */
        border-radius: 50%; 
        width: 100px; /* Setting a fixed size for uniformity */
        height: 100px;
    }

    /* Styling other images just for layout tidiness */
    body > img, footer img {
        width: 100px;
        margin: 20px;
    }

</style>
</head>
<body>

    <header>My Tutorial 4</header>

    <img src="https://placehold.co/150x150/png?text=Img+1" alt="Image 1" />

    <article>
        <header>About this tutorial</header>
        <p>In this tutorial I need to make a picture spin for ever...</p>
        
        <img src="https://placehold.co/150x150/png?text=Spinning!" alt="Spinning Image" />
    </article>

    <footer>
        my footer
        <br>
        <img src="https://placehold.co/150x150/png?text=Img+3" alt="Image 3" />
    </footer>

    <div class="ribbon"><a href="#">My Tutorial 4</a></div>

</body>
</html>
