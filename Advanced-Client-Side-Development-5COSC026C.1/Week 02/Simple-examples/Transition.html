<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #007BFF; 
            margin: 20px;
            transition: all 0.5s ease; /* Transition for all properties over 0.5 seconds */
        }

        /* Change background color and size on hover */
        .box:hover {
            background-color: #28a745; /* Change to green */
            width: 150px; /* Increase width */
            height: 150px; /* Increase height */
            border-radius: 50%; /* Make it a circle */
        }

        /* Opacity transition */
        .fade {
            width: 100px;
            height: 100px;
            background-color: #dc3545; 
            margin: 20px;
            opacity: 1; /* Fully visible */
            transition: opacity 0.5s ease; /* Transition opacity */
        }

        .fade:hover {
            opacity: 0.5; /* Reduce opacity on hover */
        }

        /* Position transition */
        .move {
            width: 100px;
            height: 100px;
            background-color: #ffc107; 
            margin: 20px;
            position: relative; /* Position relative for translation */
            transition: transform 0.5s ease; /* Transition for transform */
        }

        .move:hover {
            transform: translateX(50px); /* Move 50px to the right on hover */
        }
    </style>
</head>
<body>
    <h1>CSS Transition Example</h1>
    
    <h2>Hover over the boxes to see transitions:</h2>
    
    <div class="box"></div>
    <div class="fade"></div>
    <div class="move"></div>

    <p>Hover over each box to see the respective transitions!</p>
</body>
</html>
