<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .box {
            width: 100px;
            height: 100px;
            background-color: #007BFF; 
            margin: 20px;
            transition: transform 0.5s; /* Smooth transformation */
        }

        /* Scale transformation */
        .scale:hover {
            transform: scale(1.5); /* Increase size by 1.5 times */
        }

        /* Rotate transformation */
        .rotate:hover {
            transform: rotate(45deg); /* Rotate by 45 degrees */
        }

        /* Translate transformation */
        .translate:hover {
            transform: translate(50px, 50px); /* Move 50px right and 50px down */
        }

        /* Skew transformation */
        .skew:hover {
            transform: skew(20deg, 10deg); /* Skew 20 degrees on the X-axis and 10 degrees on the Y-axis */
        }
    </style>
</head>
<body>
    <h1>CSS Transform Example</h1>
    
    <h2>Hover over the boxes to see transformations:</h2>
    
    <div class="box scale"></div>
    <div class="box rotate"></div>
    <div class="box translate"></div>
    <div class="box skew"></div>

    <p>Hover over each box to see the respective transformations!</p>
</body>
</html>
