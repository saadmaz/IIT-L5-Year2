<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        /* Keyframes for bouncing animation */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0); /* Start at the original position */
            }
            40% {
                transform: translateY(-30px); /* Move up */
            }
            60% {
                transform: translateY(-15px); /* Move down slightly */
            }
        }

        /* Bouncing box */
        .bounce {
            width: 100px;
            height: 100px;
            background-color: #007BFF; 
            margin: 20px;
            animation: bounce 2s infinite; /* Apply bouncing animation */
        }

        /* Keyframes for spinning animation */
        @keyframes spin {
            0% {
                transform: rotate(0deg); /* Start at 0 degrees */
            }
            100% {
                transform: rotate(360deg); /* Rotate to 360 degrees */
            }
        }

        /* Spinning box */
        .spin {
            width: 100px;
            height: 100px;
            background-color: #28a745; 
            margin: 20px;
            animation: spin 1s linear infinite; /* Apply spinning animation */
        }

        /* Keyframes for fading in */
        @keyframes fade-in {
            0% {
                opacity: 0; /* Start invisible */
            }
            100% {
                opacity: 1; /* End fully visible */
            }
        }

        /* Fading in box */
        .fade-in {
            width: 100px;
            height: 100px;
            background-color: #dc3545; /* Red */
            margin: 20px;
            animation: fade-in 1s ease-in forwards; /* Apply fade-in animation */
        }

        /* Keyframes for moving animation */
        @keyframes move {
            0% {
                transform: translateX(0); /* Start at the original position */
            }
            100% {
                transform: translateX(200px); /* Move 200 pixels to the right */
            }
        }

        /* Moving box */
        .move {
            width: 100px;
            height: 100px;
            background-color: #ffc107; 
            margin: 20px;
            animation: move 2s ease-in-out forwards; /* Apply moving animation */
        }
    </style>
</head>
<body>
    <h1>CSS Animation Example</h1>
    
    <h2>Animated Boxes:</h2>
    
    <div class="bounce"></div>
    <div class="spin"></div>
    <div class="fade-in"></div>
    <div class="move"></div>

    <p>Observe the animations of each box!</p>
</body>
</html>
