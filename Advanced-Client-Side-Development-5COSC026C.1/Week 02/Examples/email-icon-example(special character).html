<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Icon Example</title>
    <style>
        /* Define a class for the email icon and set its content */
        .email-icon::before {
            content: "\2709"; /* Placeholder Unicode character for demonstration; replace with your icon code */
            font-family: Arial, Helvetica, sans-serif;
            margin-right: 5px; /* Add spacing between the icon and the email address */
        }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>
        Please feel free to reach out to us via email:
        <i><span class="email-icon"></span></i>
        <a href="mailto:contact@example.com">contact@example.com</a>
    </p>
</body>
</html>
