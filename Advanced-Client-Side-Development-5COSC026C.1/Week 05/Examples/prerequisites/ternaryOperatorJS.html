<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ternary Operator Example</title>
</head>
<body>
    <h1>Ternary Operator Example</h1>
    <script>
        const age = 18;
        const canVote = (age >= 18) ? "Yes, you can vote." : "No, you cannot vote.";
        document.write(canVote); // Output: Yes, you can vote.
    </script>
</body>
</html>
