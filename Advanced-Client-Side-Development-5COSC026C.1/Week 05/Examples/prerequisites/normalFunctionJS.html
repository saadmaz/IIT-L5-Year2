<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Function Example</title>
</head>
<body>
    <h1>Normal Function Example</h1>
    <script>
        function greet(name) {
            return "Hello, " + name + "!";
        }

        document.write(greet("Ebad")); // Output: Hello, Ebad!
    </script>
</body>
</html>
