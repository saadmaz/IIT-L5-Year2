<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Structures Example</title>
</head>
<body>
    <h1>Data Structures Example</h1>
    <script>
        // Array Example
        const fruits = ["apple", "banana", "cherry"];
        document.write("Fruits: " + fruits.join(", ")); // Output: Fruits: apple, banana, cherry

        // Object Example
        const car = {
            brand: "Toyota",
            model: "Camry",
            year: 2020
        };

        document.write("<br>Car Model: " + car.model); // Output: Car Model: Camry
    </script>
</body>
</html>
