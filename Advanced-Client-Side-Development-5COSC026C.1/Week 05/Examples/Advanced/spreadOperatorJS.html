<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spread Operator Example</title>
</head>
<body>
    <h1>Spread Operator Example</h1>
    <script>
        const fruits1 = ['apple', 'banana', 'orange'];
        const fruits2 = ['mango', 'pineapple'];

        // Using spread operator to combine arrays
        const allFruits = [...fruits1, ...fruits2];

        console.log("All Fruits:", allFruits); // Output: All Fruits: ['apple', 'banana', 'orange', 'mango', 'pineapple']
    </script>
</body>
</html>
