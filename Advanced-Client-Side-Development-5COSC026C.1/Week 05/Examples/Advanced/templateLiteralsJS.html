<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Literals Example</title>
</head>
<body>
    <h1>Template Literals Example</h1>
    <script>
        const firstName = "Ebad";
        const lastName = "Majeed"; 
        const age = 30;

        // Using template literals to create a message
        const greeting = `Hello, my name is ${firstName} ${lastName} and I am ${age} years old.`;

        // Output the message
        console.log(greeting); // Output: Hello, my name is Ebad Majeed and I am 30 years old.
        document.write(greeting); // Display the message on the web page
    </script>
</body>
</html>
