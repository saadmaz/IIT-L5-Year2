<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Layout Example</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-4">
    <div class="row">
      <div class="col-sm-6 col-lg-3 bg-primary text-white">Column 1</div>
      <div class="col-sm-6 col-lg-3 bg-secondary text-white">Column 2</div>
      <div class="col-sm-6 col-lg-3 bg-success text-white">Column 3</div>
      <div class="col-sm-6 col-lg-3 bg-danger text-white">Column 4</div>
    </div>
  </div>

  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
