spring.application.name=W2051763_TicketingSystem_BE

# MongoDB connection. Never put a real username/password here: set the MONGODB_URI
# environment variable instead (e.g. your Atlas connection string).
# Without it, a local MongoDB on the default port is used.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=ticketingSystem_be
